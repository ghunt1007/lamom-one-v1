name: Preview link

# (2026-11-02) ลิงก์ทดลองก่อน Merge — ทุก PR จะมีเว็บทดลองของตัวเองที่ https://pr-<เลข PR>.lamom-one.pages.dev
# เปิดดู/กดลองได้ก่อนกด Merge (เว็บจริง lamom-one.pages.dev ไม่เปลี่ยนจนกว่าจะ Merge)
# ⚠️ เว็บทดลองต่อฐานข้อมูลจริง: สิ่งที่บันทึกในเว็บทดลองจะไปอยู่ในข้อมูลจริงด้วย ใช้ดูหน้าตา/กดลองเป็นหลัก
# AI, อัปโหลดไฟล์ และรายงาน LINE ในเว็บทดลองอาจใช้ไม่ได้ (worker อนุญาตแค่โดเมนเว็บจริง)

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # PR จาก fork ไม่มี secret — ข้าม
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Build and deploy preview
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_SENDER_ID: ${{ secrets.VITE_FIREBASE_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_R2_WORKER_URL: ${{ secrets.VITE_R2_WORKER_URL }}
          VITE_AI_PROXY_URL: ${{ secrets.VITE_AI_PROXY_URL }}

      - name: Deploy preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 8e526fad63ca65975137a980925e409f
          command: pages deploy dist --project-name lamom-one --branch pr-${{ github.event.pull_request.number }}

      - name: Post the preview link on the PR (first time only)
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --repo "${{ github.repository }}" --body "🔎 ลิงก์ทดลองก่อน Merge: https://pr-${PR}.lamom-one.pages.dev
          (อัปเดตเองทุกครั้งที่ PR นี้มีการแก้ · ต่อฐานข้อมูลจริง ใช้ดูหน้าตา/กดลองเป็นหลัก)"
