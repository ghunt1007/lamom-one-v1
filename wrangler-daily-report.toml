name = "lamom-daily-report"
main = "workers/daily-report.js"
compatibility_date = "2024-01-01"

[vars]
ALLOWED_ORIGIN = "https://lamom-one.pages.dev"
FIREBASE_API_KEY = "AIzaSyBH098B5Ja9WiLL5sfgCvSuBqOab8aeKMo"
FIREBASE_PROJECT_ID = "lamom-one-v1"
# เป้าส่งมอบต่อเดือน (คัน) ใช้เมื่อหน้าเป้าหมายทีมยังไม่ได้ตั้งเป้าแบบ "ยอดขาย (คัน)" ของเดือนนั้น
MONTHLY_DELIVERY_TARGET = "20"
# ลบ # หน้าบรรทัดล่างเพื่อเปิด: ลูกค้าที่ทัก LINE OA ครั้งแรกจะถูกสร้างเป็นลูกค้าใหม่ (ที่มา LINE) ในแอปให้อัตโนมัติ
# AUTO_LEAD_FROM_LINE = "1"
# (ไม่บังคับ) รหัสบริษัทที่จะใส่ให้ลูกค้าจาก LINE — ถ้าไม่ใส่ เจ้าของโปรแกรมเห็นคนเดียว แล้วค่อยแจกเซลส์
# LINE_LEAD_COMPANY_ID = ""

# 11:00 UTC = 18:00 เวลาไทย (Bangkok ไม่มี DST เลยแปลงคงที่ได้ตรงตัว) ทุกวัน = รายงานสรุป
# 02:00 UTC = 09:00 เวลาไทย = เตือนงานค้างรายเซลส์ (ต้องตรงกับ MORNING_CRON ใน workers/daily-report.js)
[triggers]
crons = ["0 11 * * *", "0 2 * * *"]
